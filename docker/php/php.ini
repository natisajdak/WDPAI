; Ustawienia bazowe, bezpieczne dla produkcji. Dev nadpisuje je w php.dev.ini.

[PHP]
expose_php = Off
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
memory_limit = 256M

; Do 3 zdjęć po 5 MB w jednym zgłoszeniu usterki (limit pojedynczego pliku pilnuje też aplikacja).
upload_max_filesize = 6M
post_max_size = 20M
max_file_uploads = 5

[Date]
date.timezone = Europe/Warsaw

[Session]
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 0
