server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    # Musi pozwolić na formularz usterki z kilkoma zdjęciami (zgodnie z post_max_size w php.ini).
    client_max_body_size 20m;

    # Pliki ukryte (.env, .git itp.) nigdy nie są serwowane.
    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Wszystko, co nie jest istniejącym plikiem statycznym, obsługuje front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Żaden inny plik .php nie może zostać wykonany.
    location ~ \.php$ {
        return 404;
    }
}
